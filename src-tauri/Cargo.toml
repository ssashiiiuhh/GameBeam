[package]
name = "gamebeam"
version = "0.1.0"
description = "GameBeam macOS Menu Bar & HUD Overlay Utility"
authors = ["GameBeam Team"]
edition = "2021"
rust-version = "1.78.0"

[lib]
name = "gamebeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"

